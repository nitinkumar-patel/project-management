<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Management MVP</title>
    <style>
      :root {
        --accent-yellow: #ecad0a;
        --primary-blue: #209dd7;
        --secondary-purple: #753991;
        --navy-dark: #032147;
        --gray-text: #888888;
      }

      body {
        align-items: center;
        background: #f7f8fb;
        color: var(--navy-dark);
        display: flex;
        font-family: "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        background: white;
        border: 1px solid rgba(3, 33, 71, 0.08);
        border-radius: 28px;
        box-shadow: 0 18px 40px rgba(3, 33, 71, 0.12);
        max-width: 640px;
        padding: 40px;
      }

      p {
        color: var(--gray-text);
        line-height: 1.6;
      }

      code {
        color: var(--secondary-purple);
        font-weight: 700;
      }

      .status {
        border-left: 4px solid var(--accent-yellow);
        margin-top: 24px;
        padding-left: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from the Project Management MVP</h1>
      <p>
        FastAPI is serving this scaffold page. The real Kanban frontend will
        replace this page in the next part.
      </p>
      <div class="status">
        <strong>API status:</strong>
        <code id="api-status">checking...</code>
      </div>
    </main>
    <script>
      fetch("/api/health")
        .then((response) => response.json())
        .then((data) => {
          document.getElementById("api-status").textContent =
            `${data.status} (${data.service})`;
        })
        .catch(() => {
          document.getElementById("api-status").textContent = "unavailable";
        });
    </script>
  </body>
</html>
